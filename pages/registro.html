    <main>
    <!-- HERO DE LA PAGINA -->
    <div class="page-hero">
        <div class="container">
            <h1><i class="bi bi-person-plus-fill text-warning me-2"></i>Registro</h1>
            <p class="lead text-secondary">crea tu cuenta hoy, arma la pc de tus sueños y aprovecha <span> el envio gratis en tu primera compra.</span> no dejes que el envio afecte a tus FPS.</p>
        </div>
    </div>
    <!-- FORMULARIO DE REGISTRO -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class=" col-12 col-md-8 col-lg-5">
                <div class="card registro-card p-4 mx-auto">
                    <div class="text-center card-header  text-black mb-4">
                        <h3 class="mb-0 fw-bold">Crear Cuenta</h3>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Nombre Completo</label>
                                <input type=" text" class="form-control" placeholder="tu nombre completo">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="text" class="form-control" placeholder="tucorreo@gmail.com">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Telefono</label>
                                <input type="tel" class="form-control" placeholder="tu numero de telefono">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" placeholder="minimo 8 caracteres">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirmar contraseña</label>
                                <input type="password" class="form-control" placeholder="repeti tu contraseña">
                            </div>
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="" required>
                                <label class="form-check-label" for="terminos">acepto los <a href="/pages/error404.html" class="text-warning">terminos y condiciones</a></label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-person-check"></i>crear cuenta</button>
                        </form>
                        <hr>
                            <div class="text-center">
                                <span class="small text-muted mb-0">¿ya tienes cuenta? <a href="" class="text-warning fw-semibold">iniciar sesion</a></span>
                            </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">

</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom sticky-top shadow">
            <div class="container">
                <a class="navbar-brand fw-bold" href="../index.html">
                    <i class="bi bi-pc-display"></i> ProjectPC
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <form class="d-flex mx-auto my-2 my-lg-0 w-50">
                        <div class="input-group">
                            <input type="search" class="form-control" placeholder="Buscar componentes..." aria-label="Search">
                            <button class="btn btn-support" type="submit">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </form>
                    <ul class="navbar-nav align-items-center">
                        <li class="nav-item">
                            <a class="nav-link" href="../pages/error404.html">Nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../pages/contacto.html">Contacto</a>
                        </li>
                        <li class="nav-item px-2">
                            <a href="../pages/detalle-carrito.html" class="btn btn-outline-light position-relative border-0">
                                <i class="bi bi-cart3 fs-5"></i>
                                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">2</span>
                            </a>
                        </li>
                        <li class="nav-item d-flex gap-2 ms-lg-3 mt-2 mt-lg-0">

                        <!-- Login -->
                        <button class="btn btn-sm btn-outline-light"
                        data-bs-toggle="modal"
                        data-bs-target="#loginModal">
                            Login
                    </button>
                        <!-- Registro -->
                        <a href="../pages/pagina-registro.html"
                        class="btn btn-sm btn-support">
                        Registro
                        </a>
                    </li>
                    </ul>
                </div>
            </div>
        </nav>
    <!-- Modal login -->
        <div class="modal fade"
            id="loginModal"
            tabindex="-1"
            aria-labelledby="loginModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <!-- Modal header -->
                    <div class="modal-header">
                        <h5 class="modal-title" id="loginModalLabel">
                            Iniciar Sesión
                        </h5>
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Close">
                        </button>
                    </div>
                    <!-- Modal body -->
                    <div class="modal-body">
                        <form>
                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Correo electrónico
                                </label>
                                <input type="email"
                                    class="form-control"
                                    placeholder="Ingrese su email">
                            </div>
                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Contraseña
                                </label>
                                <input type="password"
                                    class="form-control"
                                    placeholder="Ingrese su contraseña">
                            </div>
                            <!-- Boton -->
                            <button 
                                    href="../pages/pagina-registro.html"
                                    class="btn btn-support w-100">
                                Ingresar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </header> 
    <!-- Container -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4">
                        Crear Cuenta
                    </h2>
                    <form>
                        <!-- Nombre -->
                        <div class="mb-3">
                            <label class="form-label">
                                Nombre
                            </label>
                            <input type="text"
                                   class="form-control"
                                   placeholder="Ingrese su nombre">
                        </div>
                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">
                                Correo Electrónico
                            </label>
                            <input type="email"
                                   class="form-control"
                                   placeholder="Ingrese su email">
                        </div>
                        <!-- Contraseña -->
                        <div class="mb-3">
                            <label class="form-label">
                                Contraseña
                            </label>
                            <input type="password"
                                   class="form-control"
                                   placeholder="Ingrese su contraseña">
                        </div>
                        <!-- Boton -->
                        <a href="../pages/error404.html"
                           class="btn btn-support w-100">
                            Registrarse
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
